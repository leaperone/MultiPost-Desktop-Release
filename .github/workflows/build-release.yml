name: Build and Release (Manual)

# Manual entry defaults to nightly; delegates to the same channel-aware core as
# repository_dispatch. Run only with an authorized source SHA and desktop tag.

on:
  workflow_dispatch:
    inputs:
      channel:
        description: release or nightly
        required: true
        type: choice
        options:
          - nightly
          - release
        default: nightly
      version:
        description: Release tag (vX.Y.Z or vX.Y.Z-nightly.YYYYMMDD.N)
        required: true
        type: string
      source_sha:
        description: Full 40-char commit SHA for refs/tags/desktop-<version>
        required: true
        type: string

permissions:
  contents: write

jobs:
  validate-inputs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate manual dispatch inputs
        env:
          RELEASE_CHANNEL: ${{ inputs.channel }}
          RELEASE_VERSION: ${{ inputs.version }}
          RELEASE_SOURCE_SHA: ${{ inputs.source_sha }}
        run: python3 scripts/validate_release_dispatch.py

  release-build:
    needs: validate-inputs
    uses: ./.github/workflows/release-desktop-build.yml
    with:
      channel: ${{ inputs.channel }}
      version: ${{ inputs.version }}
      source_sha: ${{ inputs.source_sha }}
    secrets: inherit
