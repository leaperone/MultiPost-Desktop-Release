name: Sync Release to S3

# Manual recovery for the stable GitHub Release only. Nightly releases are
# intentionally GitHub-only and must never be mirrored to S3/CDN.

on:
  workflow_dispatch:
    inputs:
      channel:
        description: stable release only (Nightly is GitHub-only)
        required: true
        type: choice
        options:
          - release
        default: release
      version:
        description: GitHub release tag to sync
        required: true
        type: string
      source_sha:
        description: Full 40-char source SHA (must appear in release notes)
        required: true
        type: string

concurrency:
  group: multipost-desktop-${{ inputs.channel }}
  cancel-in-progress: false

jobs:
  reject-non-release:
    if: inputs.channel != 'release'
    runs-on: ubuntu-latest
    steps:
      - name: Refuse GitHub-only channels
        run: |
          echo "::error::Nightly is GitHub-only; sync-release-to-s3 is stable release only"
          exit 1

  sync:
    if: inputs.channel == 'release'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate channel, version, SHA, and GitHub release flags
        id: meta
        env:
          RELEASE_CHANNEL: ${{ inputs.channel }}
          RELEASE_VERSION: ${{ inputs.version }}
          RELEASE_SOURCE_SHA: ${{ inputs.source_sha }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eo pipefail
          python3 scripts/validate_release_dispatch.py >> "$GITHUB_OUTPUT"
          python3 scripts/validate_github_release_channel.py

      - name: Download release assets from GitHub
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          set -eo pipefail
          mkdir -p artifacts
          gh release download "$RELEASE_VERSION" \
            -R "$GITHUB_REPOSITORY" -D artifacts --clobber
          find artifacts -type f

      - name: Validate complete manifests and artifact digests
        env:
          RELEASE_CHANNEL: ${{ inputs.channel }}
          RELEASE_VERSION: ${{ inputs.version }}
          RELEASE_ARTIFACTS_DIR: artifacts
        run: python3 scripts/validate_release_artifacts.py

      - name: Guard against older channel promotion
        env:
          RELEASE_CHANNEL: ${{ inputs.channel }}
          RELEASE_VERSION: ${{ inputs.version }}
          AWS_ACCESS_KEY_ID: ${{ secrets.BITIFUL_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.BITIFUL_SECRET_ACCESS_KEY }}
          S3_BUCKET: 2someone-web-static
          S3_PATH: ${{ steps.meta.outputs.s3_path }}
        run: |
          set -eo pipefail
          S3_ENDPOINT="https://s3.bitiful.net"
          export S3_ENDPOINT S3_PATH
          python3 scripts/check_s3_promotion.py --allow-same-version

      - name: Upload to S3 (parallel)
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.BITIFUL_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.BITIFUL_SECRET_ACCESS_KEY }}
          S3_BUCKET: 2someone-web-static
          S3_PATH: ${{ steps.meta.outputs.s3_path }}
          RELEASE_CHANNEL: ${{ inputs.channel }}
          RELEASE_ARTIFACTS_DIR: artifacts
        run: |
          set -eo pipefail
          S3_ENDPOINT="https://s3.bitiful.net"
          export AWS_ACCESS_KEY_ID AWS_SECRET_ACCESS_KEY S3_BUCKET S3_PATH S3_ENDPOINT
          python3 scripts/plan_s3_upload.py > /tmp/uploads.txt
          bash scripts/upload_in_order.sh /tmp/uploads.txt
