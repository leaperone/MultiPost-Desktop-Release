name: Build on Tag

on:
  repository_dispatch:
    types: [release-build]

permissions:
  contents: write

jobs:
  validate-payload:
    runs-on: ubuntu-latest
    outputs:
      channel: ${{ steps.out.outputs.channel }}
      version: ${{ steps.out.outputs.version }}
      source_sha: ${{ steps.out.outputs.source_sha }}
    steps:
      - uses: actions/checkout@v4

      - name: Validate repository_dispatch payload
        id: out
        env:
          RELEASE_CHANNEL: ${{ github.event.client_payload.channel }}
          RELEASE_VERSION: ${{ github.event.client_payload.version }}
          RELEASE_SOURCE_SHA: ${{ github.event.client_payload.source_sha }}
        run: |
          set -eo pipefail
          if [ -z "$RELEASE_CHANNEL" ] || [ -z "$RELEASE_VERSION" ] || [ -z "$RELEASE_SOURCE_SHA" ]; then
            echo "::error::release-build payload requires channel, version, and source_sha"
            exit 1
          fi
          python3 scripts/validate_release_dispatch.py >> "$GITHUB_OUTPUT"

  release-build:
    needs: validate-payload
    uses: ./.github/workflows/release-desktop-build.yml
    with:
      channel: ${{ needs.validate-payload.outputs.channel }}
      version: ${{ needs.validate-payload.outputs.version }}
      source_sha: ${{ needs.validate-payload.outputs.source_sha }}
    secrets: inherit
